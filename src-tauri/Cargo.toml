[package]
name = "vtuber-fans-admin"
version = "0.2.0"
description = "粉丝管理系统 · Windows 本地桌面工具"
authors = ["vtuber-fans-admin"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vtuber_fans_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
# 单实例锁：避免安装器 Finish 页 / 快捷方式 / 托盘常驻进程叠加造成双窗口
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
csv = "1.3"
calamine = "0.26"
# calamine 0.26 依赖 zip 2.x 的 ZipFile<'a>（无泛型）API；zip 2.6 起改为 ZipFile<'a, R>，需固定兼容版本
zip = "=2.4.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
# 用户显式启用同步后才使用的 B 站接口客户端；二维码以本地 SVG 生成，不依赖任何外部二维码服务
reqwest = { version = "0.12", features = ["blocking", "json"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
md-5 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
